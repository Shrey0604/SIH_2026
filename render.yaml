# Render Blueprint for the NWIS FastAPI backend.
# The frontend deploys separately on Vercel (see SIH/SIH/DEPLOY.md).
services:
  - type: web
    name: nwis-api
    runtime: python
    plan: free
    rootDir: SIH/SIH
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      # Exact Vercel production URL(s), comma-separated, e.g. https://nwis.vercel.app
      - key: FRONTEND_ORIGIN
        sync: false
      # Also allow this project's Vercel preview deployments.
      - key: FRONTEND_ORIGIN_REGEX
        value: ^https://[a-z0-9-]+\.vercel\.app$
      - key: DATA_BACKEND
        value: sqlite
      - key: DATABASE_URL
        value: sqlite:///./backend/data/nwis.db
      - key: LOCAL_STORAGE_PATH
        value: backend/data/storage
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EXTRACTION_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_COPILOT_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: GEMINI_EMBEDDING_DIM
        value: "768"
