<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111213" />
    <meta name="description" content="NWIS surfaces drilling hazards ahead of the bit from page-cited offset-well history." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <title>NWIS · Look-ahead</title>
    <script>
      // Apply a saved light appearance before first paint so the page never flashes dark.
      try {
        if (localStorage.getItem('nwis-theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch (error) {
        // Storage unavailable; the default dark appearance applies.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
